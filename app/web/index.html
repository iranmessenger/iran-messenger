<!DOCTYPE html>
<!-- Left-to-right on purpose: Flutter lays out right-to-left itself, and an
     rtl page mirrors the position of embedded elements such as videos. -->
<html lang="fa" dir="ltr">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="IRAN Messenger">
  <meta name="theme-color" content="#04122B">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">

  <!-- Installed to the home screen, it opens without browser controls. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IRAN Messenger">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="boot.css">
  <title>IRAN Messenger</title>
</head>
<body>
  <div id="boot" dir="rtl">
    <img src="icons/Icon-192.png" alt="" width="96" height="96">
    <p id="boot-text">در حال آماده‌سازی…</p>
  </div>
  <script src="boot.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
